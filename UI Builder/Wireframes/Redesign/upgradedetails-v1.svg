s-serif" font-size="17" font-weight="600" fill="#333">Requirements</text><text x="36" y="426" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Own Phuljhari ✓</text><text x="36" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">No earlier upgrade required.</text><rect x="20" y="502" width="350" height="96" rx="12" fill="#fafafa" stroke="#555" stroke-width="1"/><text x="36" y="529" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#333">Cash price: ₹115.279</text><text x="36" y="554" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Expand numbers for full precision.</text><text x="36" y="576" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Counts once toward lifetime purchases.</text><rect x="20" y="618" width="170" height="48" rx="10" fill="#fff" stroke="#555" stroke-width="1"/><text x="32" y="648" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#222">Pin as goal</text><rect x="200" y="618" width="170" height="48" rx="10" fill="#333" stroke="#555" stroke-width="1"/><text x="212" y="648" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Buy upgrade</text><rect x="20" y="682" width="350" height="48" rx="10" fill="#fff" stroke="#555" stroke-width="1"/><text x="32" y="712" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#222">Back to filtered catalogue</text><rect x="0" y="772" width="390" height="72" rx="0" fill="#eee" stroke="#555" stroke-width="1"/><text x="12" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Home</text><rect x="102.5" y="782" width="87" height="48" rx="8" fill="#333" stroke="#555" stroke-width="1"/><text x="109.5" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Upgrades