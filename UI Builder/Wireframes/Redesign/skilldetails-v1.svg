<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Festival Rush — redesign wireframe v1</title><rect x="0" y="0" width="390" height="844" rx="0" fill="#fff" stroke="#555" stroke-width="1"/><text x="20" y="39" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#333">Festival Rush</text><text x="20" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#333">Locked this run · buy the base skill to activate</text><rect x="20" y="92" width="350" height="156" rx="12" fill="#fafafa" stroke="#555" stroke-width="1"/><text x="36" y="119" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#333">A burst of festival trade</text><text x="36" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Products produce x2 income for 30s.</text><text x="36" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Manual / Helping Hands taps receive x1.25.</text><text x="36" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Tap links and Bulk Order use normal sales.</text><rect x="20" y="266" width="350" height="116" rx="12" fill="#fafafa" stroke="#555" stroke-width="1"/><text x="36" y="293" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#333">Cooldown: 5 minutes</text><text x="36" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Starts when you activate Rush.</text><text x="36" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Repurchased base skills start ready.</text><rect x="20" y="400" width="350" height="138" rx="12" fill="#fafafa" stroke="#555" stroke-width="1"/><text x="36" y="427" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#333">Buy the skill this run</text><text x="36" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Own at least one product family.</text><text x="36" y="474" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Festival Rush: Unlock · ₹386.031</text><text x="36" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Permanent cards improve an owned skill.</text><rect x="20" y="558" width="350" height="48" rx="10" fill="#333" stroke="#555" stroke-width="1"/><text x="32" y="588" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">View base skill in Upgrades</text><rect x="20" y="624" width="350" height="48" rx="10" fill="#fff" stroke="#555" stroke-width="1"/><text x="32" y="654" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#222">View skill power / timing upgrades</text><rect x="20" y="690" width="350" height="48" rx="10" fill="#fff" stroke="#555" stroke-width="1"/><text x="32" y="720" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#222">Back to shop</text></svg>