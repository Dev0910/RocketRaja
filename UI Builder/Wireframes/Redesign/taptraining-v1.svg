<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Tap training — redesign wireframe v1</title><rect x="0" y="0" width="390" height="844" rx="0" fill="#fff" stroke="#555" stroke-width="1"/><text x="20" y="39" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#333">Tap training</text><text x="20" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#333">Level 0 · current payout ₹0.85 per tap</text><rect x="20" y="92" width="350" height="136" rx="12" fill="#fafafa" stroke="#555" stroke-width="1"/><text x="36" y="119" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#333">A more valuable tap</text><text x="36" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Next level: ₹0.85 → ₹2.04 per tap</text><text x="36" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Linked product income: ₹0 for now</text><text x="36" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Only taps on the open stall earn cash.</text><rect x="20" y="248" width="350" height="98" rx="12" fill="#fafafa" stroke="#555" stroke-width="1"/><text x="36" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#333">Tap level price: ₹40</text><text x="36" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Run discounts and Talent reduce this cost.</text><rect x="20" y="366" width="80" height="48" rx="10" fill="#333" stroke="#555" stroke-width="1"/><text x="32" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">x1</text><rect x="110" y="366" width="80" height="48" rx="10" fill="#fff" stroke="#555" stroke-width="1"/><text x="122" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#222">x10</text><rect x="200" y="366" width="80" height="48" rx="10" fill="#fff" stroke="#555" stroke-width="1"/><text x="212" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#222">x100</text><rect x="290" y="366" width="80" height="48" rx="10" fill="#fff" stroke="#555" stroke-width="1"/><text x="302" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#222">Max</text><rect x="20" y="436" width="350" height="48" rx="10" fill="#333" stroke="#555" stroke-width="1"/><text x="32" y="466" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Buy 1 tap level · ₹40</text><rect x="20" y="512" width="350" height="112" rx="12" fill="#fafafa" stroke="#555" stroke-width="1"/><text x="36" y="539" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#333">Tapping cash upgrades</text><text x="36" y="564" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Direct tap profits and shop-linked payouts</text><text x="36" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">are listed together in Upgrades.</text><rect x="20" y="648" width="350" height="48" rx="10" fill="#fff" stroke="#555" stroke-width="1"/><text x="32" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#222">Open Tapping upgrades</text><rect x="20" y="710" width="350" height="48" rx="10" fill="#fff" stroke="#555" stroke-width="1"/><text x="32" y="740" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#222">Back to shop</text></svg>