<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Phuljhari Showcase — redesign wireframe v1</title><rect x="0" y="0" width="390" height="844" rx="0" fill="#fff" stroke="#555" stroke-width="1"/><text x="20" y="39" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#333">Phuljhari Showcase</text><text x="20" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#333">Common · 4.6875% chance per draw</text><rect x="20" y="92" width="350" height="188" rx="12" fill="#fafafa" stroke="#555" stroke-width="1"/><text x="36" y="119" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#333">LEVEL 1</text><text x="36" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">[Card illustration area]</text><text x="36" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333"></text><text x="36" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Automatically boosts Phuljhari profit.</text><text x="36" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">All copies remain after prestige.</text><rect x="20" y="296" width="350" height="124" rx="12" fill="#fafafa" stroke="#555" stroke-width="1"/><text x="36" y="323" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#333">One more copy → level 2</text><text x="36" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Current: x1.20 product income</text><text x="36" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Next: x1.40 product income</text><text x="36" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Every duplicate adds exactly one level.</text><rect x="20" y="436" width="350" height="128" rx="12" fill="#fafafa" stroke="#555" stroke-width="1"/><text x="36" y="463" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#333">How this card works</text><text x="36" y="488" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Applies after you own Phuljhari.</text><text x="36" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">No equipment slot or merge cost.</text><text x="36" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">No maximum card level.</text><rect x="20" y="582" width="350" height="78" rx="12" fill="#fafafa" stroke="#555" stroke-width="1"/><text x="36" y="609" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#333">Draw odds</text><text x="36" y="634" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Common 75% ÷ 16 cards = 4.6875%</text><rect x="20" y="690" width="350" height="48" rx="10" fill="#fff" stroke="#555" stroke-width="1"/><text x="32" y="720" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#222">Back to Talent</text><rect x="0" y="772" width="390" height="72" rx="0" fill="#eee" stroke="#555" stroke-width="1"/><text x="12" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Home</text><text x="109.5" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Upgrades</text><rect x="200" y="782" width="87" height="48" rx="8" fill="#333" stroke="#555" stroke-width="1"/><text x="207" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Talent</text><text x="304.5" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Prestige</text></svg>