<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Welcome back — redesign wireframe v1</title><rect x="0" y="0" width="390" height="844" rx="0" fill="#fff" stroke="#555" stroke-width="1"/><text x="20" y="39" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#333">Welcome back</text><text x="20" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#333">Your offline earnings have been added</text><rect x="20" y="94" width="350" height="118" rx="12" fill="#fafafa" stroke="#555" stroke-width="1"/><text x="36" y="121" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#333">+₹144M cash</text><text x="36" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Away for 10 hours</text><text x="36" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Normal sales at departure: ₹10,000/s</text><rect x="20" y="230" width="350" height="152" rx="12" fill="#fafafa" stroke="#555" stroke-width="1"/><text x="36" y="257" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#333">How this was earned</text><text x="36" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Credited time: 8 hours / 8-hour storage</text><text x="36" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Offline efficiency: 50%</text><text x="36" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">2 hours were beyond your storage.</text><text x="36" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Skills and tapping are excluded.</text><rect x="20" y="400" width="350" height="122" rx="12" fill="#fafafa" stroke="#555" stroke-width="1"/><text x="36" y="427" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#333">Your next step</text><text x="36" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">A pinned upgrade is now affordable.</text><text x="36" y="474" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Your skills are ready to inspect.</text><rect x="20" y="550" width="350" height="48" rx="10" fill="#333" stroke="#555" stroke-width="1"/><text x="32" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">View pinned upgrade</text><rect x="20" y="614" width="350" height="48" rx="10" fill="#fff" stroke="#555" stroke-width="1"/><text x="32" y="644" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#222">Continue to shop</text><text x="20" y="697" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#333">Closing this screen keeps the credited cash.</text><rect x="0" y="772" width="390" height="72" rx="0" fill="#eee" stroke="#555" stroke-width="1"/><rect x="5" y="782" width="87" height="48" rx="8" fill="#333" stroke="#555" stroke-width="1"/><text x="12" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Home</text><text x="109.5" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Upgrades</text><text x="207" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Talent</text><text x="304.5" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Prestige</text></svg>