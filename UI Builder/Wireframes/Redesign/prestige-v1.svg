<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Prestige — redesign wireframe v1</title><rect x="0" y="0" width="390" height="844" rx="0" fill="#fff" stroke="#555" stroke-width="1"/><text x="20" y="39" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#333">Prestige</text><text x="20" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#333">Ready · earned ₹10B / ₹10B this run</text><rect x="20" y="90" width="350" height="104" rx="12" fill="#fafafa" stroke="#555" stroke-width="1"/><text x="36" y="117" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#333">Guaranteed permanent income</text><text x="36" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Fame: 0 → 1</text><text x="36" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Income multiplier: x1 → x6</text><rect x="20" y="210" width="350" height="112" rx="12" fill="#fafafa" stroke="#555" stroke-width="1"/><text x="36" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#333">3 free Talent draws</text><text x="36" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">First prestige always awards 3 credits.</text><text x="36" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Card results are random; credits persist.</text><rect x="20" y="338" width="350" height="174" rx="12" fill="#fafafa" stroke="#555" stroke-width="1"/><text x="36" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#333">Reset / keep</text><text x="36" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">RESET   Cash, product and tap levels,</text><text x="36" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">              cash upgrades, skills and effects.</text><text x="36" y="434" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333"></text><text x="36" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">KEEP     Fame, cards, KK, unused credits,</text><text x="36" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">              lifetime purchases, decorations.</text><rect x="20" y="528" width="350" height="114" rx="12" fill="#fafafa" stroke="#555" stroke-width="1"/><text x="36" y="555" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#333">Rebuild with your permanent gains</text><text x="36" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Start with ₹30 for a manual Phuljhari buy.</text><text x="36" y="602" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Next run target: ₹15B</text><text x="36" y="624" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#333">Stay longer: +2 Fame at ₹40B earned.</text><rect x="20" y="687" width="165" height="48" rx="10" fill="#fff" stroke="#555" stroke-width="1"/><text x="32" y="717" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#222">Continue run</text><rect x="200" y="687" width="170" height="48" rx="10" fill="#333" stroke="#555" stroke-width="1"/><text x="212" y="717" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Confirm prestige</text><rect x="0" y="772" width="390" height="72" rx="0" fill="#eee" stroke="#555" stroke-width="1"/><text x="12" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Home</text><text x="109.5" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Upgrades</text><text x="207" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Talent</text><rect x="297.5" y="782" width="87" height="48" rx="8" fill="#333" stroke="#555" stroke-width="1"/><text x="304.5" y="812" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Prestige</text></svg>